services:
  proxypulse:
    build: .
    container_name: proxypulse
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"     # Web Dashboard & REST API
      - "${GATEWAY_PORT:-8081}:8081" # Rotating Proxy Gateway
    volumes:
      - ./data:/data
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - GATEWAY_ENABLED=${GATEWAY_ENABLED:-true}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8081
      - GATEWAY_STRATEGY=${GATEWAY_STRATEGY:-fastest}
      - CHECKER_CONCURRENCY=${CHECKER_CONCURRENCY:-100}
      - CHECKER_TIMEOUT=${CHECKER_TIMEOUT:-6.0}
      - CHECK_TARGET_URL=${CHECK_TARGET_URL:-http://httpbin.org/ip}
      - AUTO_SCRAPE_INTERVAL=${AUTO_SCRAPE_INTERVAL:-0}
      - AUTO_CHECK_INTERVAL=${AUTO_CHECK_INTERVAL:-0}
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
